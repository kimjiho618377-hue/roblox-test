<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox에 로그인</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Source Sans Pro', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { text-decoration: none; }
        .navbar {
            background: #101010;
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }
        .navbar-inner {
            max-width: 1200px; width: 100%; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .navbar-left { display: flex; align-items: center; gap: 24px; }
        .navbar-logo { display: flex; align-items: center; }
        .navbar-logo img { height: 28px; display: block; }
        .navbar-link { color: #aaa; font-size: 13px; font-weight: 500; }
        .navbar-link:hover { color: #fff; text-decoration: none; }
        .navbar-right { display: flex; align-items: center; gap: 12px; }
        .nav-signup {
            color: #ccc; font-size: 13px; font-weight: 600;
            padding: 5px 18px; border: 1px solid #555; border-radius: 30px;
        }
        .nav-signup:hover { border-color: #888; color: #fff; text-decoration: none; }
        .nav-login { color: #ccc; font-size: 13px; font-weight: 600; }
        .nav-login:hover { color: #fff; text-decoration: none; }

        .main-content {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 80px 16px 60px; margin-top: 48px;
        }
        .login-card {
            background: #fff; border-radius: 12px; padding: 36px 32px 32px;
            width: 368px; max-width: 100%; box-shadow: 0 1px 8px rgba(0,0,0,0.06);
        }
        .login-header { text-align: center; margin-bottom: 20px; }
        .login-header h1 { font-size: 24px; font-weight: 700; color: #111; margin-top: 12px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
        .form-group input {
            width: 100%; padding: 11px 13px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 15px; background: #fff; outline: none; color: #333;
        }
        .form-group input:focus { border-color: #aaa; }

        .login-btn {
            width: 100%; padding: 12px; background: #101010; color: #fff;
            border: none; border-radius: 30px; font-size: 15px; font-weight: 700;
            margin-top: 4px; cursor: pointer;
        }
        .login-btn:hover { background: #2a2a2a; }

        .forgot-link { display: block; text-align: center; margin-top: 14px; font-size: 13px; color: #00a2ff; font-weight: 500; }
        .divider-wrap { display: flex; align-items: center; margin: 20px 0; color: #999; font-size: 12px; }
        .divider-wrap::before, .divider-wrap::after { content: ''; flex: 1; height: 1px; background: #e5e5e5; }
        .divider-wrap span { padding: 0 14px; }
        .device-btn {
            width: 100%; padding: 11px; background: #fff; color: #555;
            border: 1px solid #ddd; border-radius: 30px; font-size: 14px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .device-btn:hover { background: #f9f9f9; }
        .signup-text { text-align: center; margin-top: 20px; font-size: 14px; color: #777; }
        .signup-text a { color: #00a2ff; font-weight: 700; }
        .error-msg {
            color: #a00; font-size: 13px; margin-top: 10px; display: none;
            padding: 8px 10px; background: #fef0ef; border-radius: 6px; text-align: center;
        }
        .info-msg {
            color: #555; font-size: 13px; margin-top: 10px;
            padding: 8px 10px; background: #f0f7ff; border-radius: 6px; text-align: center;
            display: none;
        }

        #step2fa { display: none; }

        .footer { background: #101010; padding: 16px 24px; text-align: center; }
        .footer-links { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-bottom: 8px; }
        .footer-links a { color: #888; font-size: 11px; }
        .footer-links a:hover { color: #fff; }
        .footer-copy { color: #555; font-size: 11px; }

        @media (max-width: 767px) {
            .navbar-link { display: none; }
            .login-card { padding: 28px 16px 24px; border-radius: 0; box-shadow: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <a href="/" class="navbar-logo">
                    <img src="https://cdn.foundation.roblox.com/current/StudioLogo.svg" alt="Roblox">
                </a>
                <a href="#" class="navbar-link">차트</a>
                <a href="#" class="navbar-link">마켓플레이스</a>
                <a href="#" class="navbar-link">만들기</a>
                <a href="#" class="navbar-link">Robux</a>
            </div>
            <div class="navbar-right">
                <a href="#" class="nav-signup">회원가입</a>
                <a href="#" class="nav-login">로그인</a>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="login-card">
            <div class="login-header">
                <img src="https://cdn.foundation.roblox.com/current/StudioLogo.svg" alt="Roblox" style="width:56px;height:56px;margin-bottom:12px;">
                <h1 id="pageTitle">Roblox에 로그인</h1>
            </div>

            <form id="loginForm">
